<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>打砖块游戏</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: Arial, sans-serif;
        }
        .game-container {
            background: white;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            text-align: center;
        }
        canvas {
            border: 3px solid #333;
            border-radius: 8px;
            display: block;
            margin: 20px auto;
            background: #f0f0f0;
        }
        .info {
            display: flex;
            justify-content: space-around;
            margin: 15px 0;
            font-size: 18px;
            font-weight: bold;
        }
        .info span {
            color: #667eea;
        }
        button {
            background: #667eea;
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 16px;
            border-radius: 25px;
            cursor: pointer;
            margin: 5px;
            transition: transform 0.2s;
        }
        button:hover {
            transform: scale(1.05);
            background: #764ba2;
        }
        .instructions {
            margin-top: 15px;
            font-size: 14px;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <h1>🎮 打砖块游戏</h1>
        <div class="info">
            <div>分数: <span id="score">0</span></div>
            <div>生命: <span id="lives">3</span></div>
            <div>关卡: <span id="level">1</span></div>
        </div>
        <canvas id="gameCanvas" width="800" height="600"></canvas>
        <div>
            <button onclick="startGame()">开始游戏</button>
            <button onclick="resetGame()">重新开始</button>
        </div>
        <div class="instructions">
            <p>🎯 操作方式：方向键 ← → 或鼠标移动控制挡板</p>
            <p>🚀 空格键或点击发射球</p>
        </div>
    </div>
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreElement = document.getElementById('score');
        const livesElement = document.getElementById('lives');
        const levelElement = document.getElementById('level');
        let gameRunning = false;
        let score = 0;
        let lives = 3;
        let level = 1;
        let animationId;
        const paddle = {
            width: 120,
            height: 15,
            x: canvas.width / 2 - 60,
            y: canvas.height - 30,
            speed: 8,
            dx: 0
        };
        const ball = {
            x: canvas.width / 2,
            y: canvas.height - 50,
            radius: 8,
            speed: 5,
            dx: 5,
            dy: -5,
            onPaddle: true
        };
        const brickConfig = {
            rowCount: 5,
            columnCount: 10,
            width: 70,
            height: 25,
            padding: 10,
            offsetTop: 50,
            offsetLeft: 35
        };
        let bricks = [];
        function initBricks() {
            bricks = [];
            for (let c = 0; c < brickConfig.columnCount; c++) {
                bricks[c] = [];
                for (let r = 0; r < brickConfig.rowCount; r++) {
                    bricks[c][r] = {
                        x: c * (brickConfig.width + brickConfig.padding) + brickConfig.offsetLeft,
                        y: r * (brickConfig.height + brickConfig.padding) + brickConfig.offsetTop,
                        status: 1,
                        color: \`hsl(\${c * 36}, 70%, 60%)\`
                    };
                }
            }
        }
        function drawPaddle() {
            ctx.beginPath();
            ctx.roundRect(paddle.x, paddle.y, paddle.width, paddle.height, 8);
            ctx.fillStyle = '#667eea';
            ctx.fill();
            ctx.closePath();
        }
        function drawBall() {
            ctx.beginPath();
            ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
            ctx.fillStyle = '#ff6b6b';
            ctx.fill();
            ctx.closePath();
        }
        function drawBricks() {
            for (let c = 0; c < brickConfig.columnCount; c++) {
                for (let r = 0; r < brickConfig.rowCount; r++) {
                    const brick = bricks[c][r];
                    if (brick.status === 1) {
                        ctx.beginPath();
                        ctx.roundRect(brick.x, brick.y, brickConfig.width, brickConfig.height, 5);
                        ctx.fillStyle = brick.color;
                        ctx.fill();
                        ctx.closePath();
                    }
                }
            }
        }
        function movePaddle() {
            paddle.x += paddle.dx;
            if (paddle.x < 0) paddle.x = 0;
            if (paddle.x + paddle.width > canvas.width) paddle.x = canvas.width - paddle.width;
        }
        function moveBall() {
            if (ball.onPaddle) {
                ball.x = paddle.x + paddle.width / 2;
                ball.y = paddle.y - ball.radius;
                return;
            }
            ball.x += ball.dx;
            ball.y += ball.dy;
            if (ball.x + ball.radius > canvas.width || ball.x - ball.radius < 0) {
                ball.dx = -ball.dx;
            }
            if (ball.y - ball.radius < 0) {
                ball.dy = -ball.dy;
            }
            if (ball.y + ball.radius > paddle.y &&
                ball.x > paddle.x &&
                ball.x < paddle.x + paddle.width) {
                ball.dy = -ball.speed;
                const hitPoint = (ball.x - paddle.x) / paddle.width;
                ball.dx = ball.speed * (hitPoint - 0.5) * 2;
            }
            for (let c = 0; c < brickConfig.columnCount; c++) {
                for (let r = 0; r < brickConfig.rowCount; r++) {
                    const brick = bricks[c][r];
                    if (brick.status === 1) {
                        if (ball.x > brick.x &&
                            ball.x < brick.x + brickConfig.width &&
                            ball.y > brick.y &&
                            ball.y < brick.y + brickConfig.height) {
                            ball.dy = -ball.dy;
                            brick.status = 0;
                            score += 10;
                            scoreElement.textContent = score;
                            if (checkWin()) {
                                levelUp();
                            }
                        }
                    }
                }
            }
            if (ball.y + ball.radius > canvas.height) {
                lives--;
                livesElement.textContent = lives;
                if (lives === 0) {
                    gameOver();
                } else {
                    resetBall();
                }
            }
        }
        function checkWin() {
            for (let c = 0; c < brickConfig.columnCount; c++) {
                for (let r = 0; r < brickConfig.rowCount; r++) {
                    if (bricks[c][r].status === 1) {
                        return false;
                    }
                }
            }
            return true;
        }
        function levelUp() {
            level++;
            levelElement.textContent = level;
            ball.speed += 0.5;
            initBricks();
            resetBall();
        }
        function resetBall() {
            ball.x = paddle.x + paddle.width / 2;
            ball.y = paddle.y - ball.radius;
            ball.dx = ball.speed;
            ball.dy = -ball.speed;
            ball.onPaddle = true;
        }
        function gameOver() {
            gameRunning = false;
            cancelAnimationFrame(animationId);
            ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = 'white';
            ctx.font = 'bold 48px Arial';
            ctx.textAlign = 'center';
            ctx.fillText('游戏结束!', canvas.width / 2, canvas.height / 2);
            ctx.font = '24px Arial';
            ctx.fillText(\`最终分数: \${score}\`, canvas.width / 2, canvas.height / 2 + 50);
        }
        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawBricks();
            drawPaddle();
            drawBall();
            if (gameRunning) {
                movePaddle();
                moveBall();
                animationId = requestAnimationFrame(draw);
            }
        }
        function startGame() {
            if (!gameRunning) {
                gameRunning = true;
                if (!ball.onPaddle) {
                    draw();
                }
            } else if (ball.onPaddle) {
                ball.onPaddle = false;
                ball.dy = -ball.speed;
                ball.dx = ball.speed;
                draw();
            }
        }
        function resetGame() {
            gameRunning = false;
            cancelAnimationFrame(animationId);
            score = 0;
            lives = 3;
            level = 1;
            ball.speed = 5;
            scoreElement.textContent = score;
            livesElement.textContent = lives;
            levelElement.textContent = level;
            paddle.x = canvas.width / 2 - paddle.width / 2;
            initBricks();
            resetBall();
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawBricks();
            drawPaddle();
            drawBall();
        }
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight' || e.key === 'd') {
                paddle.dx = paddle.speed;
            } else if (e.key === 'ArrowLeft' || e.key === 'a') {
                paddle.dx = -paddle.speed;
            } else if (e.key === ' ' && ball.onPaddle) {
                e.preventDefault();
                startGame();
            }
        });
        document.addEventListener('keyup', (e) => {
            if (e.key === 'ArrowRight' || e.key === 'd' ||
                e.key === 'ArrowLeft' || e.key === 'a') {
                paddle.dx = 0;
            }
        });
        canvas.addEventListener('mousemove', (e) => {
            const rect = canvas.getBoundingClientRect();
            const mouseX = e.clientX - rect.left;
            paddle.x = mouseX - paddle.width / 2;
            if (paddle.x < 0) paddle.x = 0;
            if (paddle.x + paddle.width > canvas.width) paddle.x = canvas.width - paddle.width;
            if (ball.onPaddle) {
                ball.x = paddle.x + paddle.width / 2;
                draw();
            }
        });
        canvas.addEventListener('click', () => {
            if (ball.onPaddle) {
                startGame();
            }
        });
        initBricks();
        draw();
    </script>
</body>
</html>
