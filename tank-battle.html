<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>坦克大战</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #1a1a2e;
            font-family: 'Arial', sans-serif;
        }
        #gameContainer {
            position: relative;
        }
        #gameCanvas {
            border: 3px solid #4a4a6a;
            background: #16213e;
        }
        #ui {
            position: absolute;
            top: 10px;
            left: 10px;
            color: #fff;
            font-size: 18px;
        }
        #startScreen, #gameOverScreen {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: #fff;
        }
        #startScreen h1, #gameOverScreen h1 {
            font-size: 36px;
            margin-bottom: 20px;
            color: #e94560;
        }
        #startScreen p, #gameOverScreen p {
            font-size: 16px;
            margin-bottom: 20px;
        }
        button {
            padding: 15px 30px;
            font-size: 18px;
            background: #e94560;
            color: #fff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.3s;
        }
        button:hover {
            background: #c73e54;
        }
        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="gameCanvas" width="600" height="600"></canvas>
        <div id="ui">
            <div>分数: <span id="score">0</span></div>
            <div>生命: <span id="lives">3</span></div>
        </div>
        <div id="startScreen">
            <h1>坦克大战</h1>
            <p>使用方向键或WASD移动，空格键射击</p>
            <button onclick="startGame()">开始游戏</button>
        </div>
        <div id="gameOverScreen" class="hidden">
            <h1>游戏结束</h1>
            <p>最终分数: <span id="finalScore">0</span></p>
            <button onclick="startGame()">重新开始</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('score');
        const livesEl = document.getElementById('lives');
        const finalScoreEl = document.getElementById('finalScore');
        const startScreen = document.getElementById('startScreen');
        const gameOverScreen = document.getElementById('gameOverScreen');

        let gameRunning = false;
        let score = 0;
        let lives = 3;
        let player, enemies, bullets, enemyBullets;
        let keys = {};
        let enemySpawnTimer = 0;
        let enemySpawnInterval = 2000;

        // 玩家坦克
        class Player {
            constructor() {
                this.x = canvas.width / 2 - 20;
                this.y = canvas.height - 60;
                this.width = 40;
                this.height = 40;
                this.speed = 3;
                this.direction = 'up';
                this.shootCooldown = 0;
            }

            draw() {
                ctx.fillStyle = '#4a90d9';
                ctx.fillRect(this.x, this.y, this.width, this.height);
                // 炮塔
                ctx.fillStyle = '#357abd';
                if (this.direction === 'up') {
                    ctx.fillRect(this.x + 15, this.y - 10, 10, 20);
                } else if (this.direction === 'down') {
                    ctx.fillRect(this.x + 15, this.y + 30, 10, 20);
                } else if (this.direction === 'left') {
                    ctx.fillRect(this.x - 10, this.y + 15, 20, 10);
                } else {
                    ctx.fillRect(this.x + 30, this.y + 15, 20, 10);
                }
            }

            update() {
                if (keys['ArrowUp'] || keys['KeyW']) {
                    this.y = Math.max(0, this.y - this.speed);
                    this.direction = 'up';
                }
                if (keys['ArrowDown'] || keys['KeyS']) {
                    this.y = Math.min(canvas.height - this.height, this.y + this.speed);
                    this.direction = 'down';
                }
                if (keys['ArrowLeft'] || keys['KeyA']) {
                    this.x = Math.max(0, this.x - this.speed);
                    this.direction = 'left';
                }
                if (keys['ArrowRight'] || keys['KeyD']) {
                    this.x = Math.min(canvas.width - this.width, this.x + this.speed);
                    this.direction = 'right';
                }
                if (keys['Space'] && this.shootCooldown <= 0) {
                    this.shoot();
                    this.shootCooldown = 30;
                }
                if (this.shootCooldown > 0) this.shootCooldown--;
            }

            shoot() {
                let bulletX = this.x + this.width / 2 - 3;
                let bulletY = this.y;
                if (this.direction === 'down') bulletY = this.y + this.height;
                if (this.direction === 'left') bulletX = this.x;
                if (this.direction === 'right') bulletX = this.x + this.width;
                bullets.push(new Bullet(bulletX, bulletY, this.direction, true));
            }
        }

        // 敌人坦克
        class Enemy {
            constructor() {
                this.x = Math.random() * (canvas.width - 40);
                this.y = -40;
                this.width = 40;
                this.height = 40;
                this.speed = 1 + Math.random();
                this.direction = 'down';
                this.shootCooldown = Math.random() * 100 + 50;
            }

            draw() {
                ctx.fillStyle = '#e94560';
                ctx.fillRect(this.x, this.y, this.width, this.height);
                // 炮塔
                ctx.fillStyle = '#c73e54';
                if (this.direction === 'up') {
                    ctx.fillRect(this.x + 15, this.y - 10, 10, 20);
                } else if (this.direction === 'down') {
                    ctx.fillRect(this.x + 15, this.y + 30, 10, 20);
                } else if (this.direction === 'left') {
                    ctx.fillRect(this.x - 10, this.y + 15, 20, 10);
                } else {
                    ctx.fillRect(this.x + 30, this.y + 15, 20, 10);
                }
            }

            update() {
                this.y += this.speed;
                if (Math.random() < 0.02) {
                    this.direction = ['up', 'down', 'left', 'right'][Math.floor(Math.random() * 4)];
                }
                if (this.shootCooldown > 0) this.shootCooldown--;
                if (this.shootCooldown <= 0) {
                    this.shoot();
                    this.shootCooldown = Math.random() * 100 + 50;
                }
            }

            shoot() {
                let bulletX = this.x + this.width / 2 - 3;
                let bulletY = this.y;
                if (this.direction === 'down') bulletY = this.y + this.height;
                if (this.direction === 'left') bulletX = this.x;
                if (this.direction === 'right') bulletX = this.x + this.width;
                enemyBullets.push(new Bullet(bulletX, bulletY, this.direction, false));
            }
        }

        // 子弹
        class Bullet {
            constructor(x, y, direction, isPlayer) {
                this.x = x;
                this.y = y;
                this.width = 6;
                this.height = 6;
                this.speed = 5;
                this.direction = direction;
                this.isPlayer = isPlayer;
            }

            draw() {
                ctx.fillStyle = this.isPlayer ? '#ffff00' : '#ff6b6b';
                ctx.fillRect(this.x, this.y, this.width, this.height);
            }

            update() {
                if (this.direction === 'up') this.y -= this.speed;
                if (this.direction === 'down') this.y += this.speed;
                if (this.direction === 'left') this.x -= this.speed;
                if (this.direction === 'right') this.x += this.speed;
            }
        }

        function startGame() {
            gameRunning = true;
            score = 0;
            lives = 3;
            player = new Player();
            enemies = [];
            bullets = [];
            enemyBullets = [];
            enemySpawnTimer = 0;
            scoreEl.textContent = score;
            livesEl.textContent = lives;
            startScreen.classList.add('hidden');
            gameOverScreen.classList.add('hidden');
            gameLoop();
        }

        function spawnEnemy() {
            enemies.push(new Enemy());
        }

        function checkCollision(rect1, rect2) {
            return rect1.x < rect2.x + rect2.width &&
                   rect1.x + rect1.width > rect2.x &&
                   rect1.y < rect2.y + rect2.height &&
                   rect1.y + rect1.height > rect2.y;
        }

        function gameLoop() {
            if (!gameRunning) return;

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 生成敌人
            enemySpawnTimer += 16;
            if (enemySpawnTimer >= enemySpawnInterval) {
                spawnEnemy();
                enemySpawnTimer = 0;
                if (enemySpawnInterval > 500) enemySpawnInterval -= 50;
            }

            // 更新玩家
            player.update();
            player.draw();

            // 更新敌人
            enemies.forEach((enemy, index) => {
                enemy.update();
                enemy.draw();
                if (enemy.y > canvas.height) {
                    enemies.splice(index, 1);
                }
            });

            // 更新玩家子弹
            bullets.forEach((bullet, index) => {
                bullet.update();
                bullet.draw();
                if (bullet.y < 0 || bullet.y > canvas.height || 
                    bullet.x < 0 || bullet.x > canvas.width) {
                    bullets.splice(index, 1);
                    return;
                }
                // 检测击中敌人
                enemies.forEach((enemy, enemyIndex) => {
                    if (checkCollision(bullet, enemy)) {
                        bullets.splice(index, 1);
                        enemies.splice(enemyIndex, 1);
                        score += 100;
                        scoreEl.textContent = score;
                    }
                });
            });

            // 更新敌人子弹
            enemyBullets.forEach((bullet, index) => {
                bullet.update();
                bullet.draw();
                if (bullet.y < 0 || bullet.y > canvas.height || 
                    bullet.x < 0 || bullet.x > canvas.width) {
                    enemyBullets.splice(index, 1);
                    return;
                }
                // 检测击中玩家
                if (checkCollision(bullet, player)) {
                    enemyBullets.splice(index, 1);
                    lives--;
                    livesEl.textContent = lives;
                    if (lives <= 0) {
                        gameOver();
                    }
                }
            });

            // 检测敌人撞击玩家
            enemies.forEach((enemy, index) => {
                if (checkCollision(enemy, player)) {
                    enemies.splice(index, 1);
                    lives--;
                    livesEl.textContent = lives;
                    if (lives <= 0) {
                        gameOver();
                    }
                }
            });

            requestAnimationFrame(gameLoop);
        }

        function gameOver() {
            gameRunning = false;
            finalScoreEl.textContent = score;
            gameOverScreen.classList.remove('hidden');
        }

        // 键盘事件
        document.addEventListener('keydown', (e) => {
            keys[e.code] = true;
            if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code)) {
                e.preventDefault();
            }
        });

        document.addEventListener('keyup', (e) => {
            keys[e.code] = false;
        });
    </script>
</body>
</html>
