<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>打砖块游戏</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            font-family: 'Arial', sans-serif;
            overflow: hidden;
        }

        .game-container {
            text-align: center;
        }

        h1 {
            color: #e94560;
            margin-bottom: 20px;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }

        canvas {
            border: 4px solid #e94560;
            border-radius: 10px;
            box-shadow: 0 0 30px rgba(233, 69, 96, 0.3);
        }

        .info {
            margin-top: 20px;
            color: #fff;
            font-size: 1.2em;
        }

        .controls {
            margin-top: 15px;
            color: #aaa;
            font-size: 0.9em;
        }

        .btn {
            margin-top: 20px;
            padding: 12px 30px;
            font-size: 1.1em;
            background: #e94560;
            color: white;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn:hover {
            background: #ff6b6b;
            transform: scale(1.05);
        }
    </style>
</head>
<body>
    <div class="game-container">
        <h1>🎮 打砖块游戏</h1>
        <canvas id="gameCanvas" width="800" height="500"></canvas>
        <div class="info">
            <span>分数: <strong id="score">0</strong></span>
            <span style="margin-left: 50px;">生命: <strong id="lives">3</strong></span>
        </div>
        <div class="controls">
            ← → 或 A/D 移动挡板 | 空格键 开始/暂停
        </div>
        <button class="btn" onclick="resetGame()">🔄 重新开始</button>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // 游戏状态
        let score = 0;
        let lives = 3;
        let gameRunning = false;
        let gamePaused = false;

        // 挡板
        const paddle = {
            width: 120,
            height: 15,
            x: 0,
            speed: 8,
            dx: 0
        };

        // 球
        const ball = {
            radius: 10,
            x: 0,
            y: 0,
            speed: 5,
            dx: 5,
            dy: -5
        };

        // 砖块设置
        const brickRowCount = 5;
        const brickColumnCount = 10;
        const brickPadding = 8;
        const brickOffsetTop = 50;
        const brickOffsetLeft = 35;
        const brickWidth = 65;
        const brickHeight = 25;

        // 砖块颜色
        const brickColors = ['#ff6b6b', '#feca57', '#48dbfb', '#1dd1a1', '#ff9ff3'];

        let bricks = [];

        // 初始化砖块
        function initBricks() {
            bricks = [];
            for (let c = 0; c < brickColumnCount; c++) {
                bricks[c] = [];
                for (let r = 0; r < brickRowCount; r++) {
                    bricks[c][r] = { 
                        x: 0, 
                        y: 0, 
                        status: 1,
                        color: brickColors[r]
                    };
                }
            }
        }

        // 初始化游戏
        function init() {
            paddle.x = canvas.width / 2 - paddle.width / 2;
            ball.x = canvas.width / 2;
            ball.y = canvas.height - 50;
            ball.dx = ball.speed * (Math.random() > 0.5 ? 1 : -1);
            ball.dy = -ball.speed;
            initBricks();
            score = 0;
            lives = 3;
            updateScore();
            updateLives();
        }

        // 更新分数显示
        function updateScore() {
            document.getElementById('score').textContent = score;
        }

        // 更新生命显示
        function updateLives() {
            document.getElementById('lives').textContent = lives;
        }

        // 绘制挡板
        function drawPaddle() {
            const gradient = ctx.createLinearGradient(paddle.x, paddle.y, paddle.x, paddle.y + paddle.height);
            gradient.addColorStop(0, '#e94560');
            gradient.addColorStop(1, '#c73e54');
            
            ctx.fillStyle = gradient;
            ctx.beginPath();
            ctx.roundRect(paddle.x, canvas.height - paddle.height - 10, paddle.width, paddle.height, 8);
            ctx.fill();
        }

        // 绘制球
        function drawBall() {
            const gradient = ctx.createRadialGradient(ball.x - 3, ball.y - 3, 0, ball.x, ball.y, ball.radius);
            gradient.addColorStop(0, '#ffffff');
            gradient.addColorStop(1, '#e94560');
            
            ctx.beginPath();
            ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
            ctx.fillStyle = gradient;
            ctx.fill();
            ctx.closePath();
        }

        // 绘制砖块
        function drawBricks() {
            for (let c = 0; c < brickColumnCount; c++) {
                for (let r = 0; r < brickRowCount; r++) {
                    if (bricks[c][r].status === 1) {
                        const brickX = c * (brickWidth + brickPadding) + brickOffsetLeft;
                        const brickY = r * (brickHeight + brickPadding) + brickOffsetTop;
                        
                        bricks[c][r].x = brickX;
                        bricks[c][r].y = brickY;
                        
                        const gradient = ctx.createLinearGradient(brickX, brickY, brickX, brickY + brickHeight);
                        gradient.addColorStop(0, bricks[c][r].color);
                        gradient.addColorStop(1, adjustColor(bricks[c][r].color, -30));
                        
                        ctx.fillStyle = gradient;
                        ctx.beginPath();
                        ctx.roundRect(brickX, brickY, brickWidth, brickHeight, 5);
                        ctx.fill();
                    }
                }
            }
        }

        // 调整颜色亮度
        function adjustColor(color, amount) {
            const hex = color.replace('#', '');
            const r = Math.max(0, Math.min(255, parseInt(hex.substr(0, 2), 16) + amount));
            const g = Math.max(0, Math.min(255, parseInt(hex.substr(2, 2), 16) + amount));
            const b = Math.max(0, Math.min(255, parseInt(hex.substr(4, 2), 16) + amount));
            return `#${r.toString(16).padStart(2, '0')}${g.toString(16).padStart(2, '0')}${b.toString(16).padStart(2, '0')}`;
        }

        // 碰撞检测
        function collisionDetection() {
            for (let c = 0; c < brickColumnCount; c++) {
                for (let r = 0; r < brickRowCount; r++) {
                    const b = bricks[c][r];
                    if (b.status === 1) {
                        if (ball.x > b.x && ball.x < b.x + brickWidth && 
                            ball.y > b.y && ball.y < b.y + brickHeight) {
                            ball.dy = -ball.dy;
                            b.status = 0;
                            score += 10;
                            updateScore();
                            
                            // 检查是否获胜
                            if (score === brickRowCount * brickColumnCount * 10) {
                                gameRunning = false;
                                setTimeout(() => {
                                    alert('🎉 恭喜你赢了！最终得分: ' + score);
                                    resetGame();
                                }, 100);
                            }
                        }
                    }
                }
            }
        }

        // 移动挡板
        function movePaddle() {
            paddle.x += paddle.dx;
            
            // 边界检测
            if (paddle.x < 0) paddle.x = 0;
            if (paddle.x + paddle.width > canvas.width) paddle.x = canvas.width - paddle.width;
        }

        // 移动球
        function moveBall() {
            ball.x += ball.dx;
            ball.y += ball.dy;
            
            // 左右墙壁碰撞
            if (ball.x + ball.radius > canvas.width || ball.x - ball.radius < 0) {
                ball.dx = -ball.dx;
            }
            
            // 顶部墙壁碰撞
            if (ball.y - ball.radius < 0) {
                ball.dy = -ball.dy;
            }
            
            // 底部碰撞（球掉落）
            if (ball.y + ball.radius > canvas.height - paddle.height - 10) {
                if (ball.x > paddle.x && ball.x < paddle.x + paddle.width) {
                    // 挡板碰撞
                    ball.dy = -Math.abs(ball.dy);
                    
                    // 根据击中位置调整角度
                    const hitPos = (ball.x - paddle.x) / paddle.width;
                    ball.dx = ball.speed * (hitPos - 0.5) * 2;
                } else if (ball.y + ball.radius > canvas.height) {
                    // 球掉落
                    lives--;
                    updateLives();
                    
                    if (lives === 0) {
                        gameRunning = false;
                        setTimeout(() => {
                            alert('💔 游戏结束！最终得分: ' + score);
                            resetGame();
                        }, 100);
                    } else {
                        // 重置球的位置
                        ball.x = canvas.width / 2;
                        ball.y = canvas.height - 50;
                        ball.dx = ball.speed * (Math.random() > 0.5 ? 1 : -1);
                        ball.dy = -ball.speed;
                        paddle.x = canvas.width / 2 - paddle.width / 2;
                    }
                }
            }
        }

        // 绘制
        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // 绘制背景
            const bgGradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
            bgGradient.addColorStop(0, '#1a1a2e');
            bgGradient.addColorStop(1, '#16213e');
            ctx.fillStyle = bgGradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            drawBricks();
            drawBall();
            drawPaddle();
        }

        // 游戏循环
        function gameLoop() {
            if (gameRunning && !gamePaused) {
                movePaddle();
                moveBall();
                collisionDetection();
            }
            draw();
            requestAnimationFrame(gameLoop);
        }

        // 重置游戏
        function resetGame() {
            init();
            gameRunning = false;
            gamePaused = false;
        }

        // 键盘事件
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') {
                paddle.dx = -paddle.speed;
            } else if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') {
                paddle.dx = paddle.speed;
            } else if (e.key === ' ') {
                e.preventDefault();
                if (!gameRunning) {
                    gameRunning = true;
                } else {
                    gamePaused = !gamePaused;
                }
            }
        });

        document.addEventListener('keyup', (e) => {
            if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A' || 
                e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') {
                paddle.dx = 0;
            }
        });

        // 鼠标控制
        canvas.addEventListener('mousemove', (e) => {
            const rect = canvas.getBoundingClientRect();
            const mouseX = e.clientX - rect.left;
            paddle.x = mouseX - paddle.width / 2;
            
            if (paddle.x < 0) paddle.x = 0;
            if (paddle.x + paddle.width > canvas.width) paddle.x = canvas.width - paddle.width;
        });

        // 点击开始
        canvas.addEventListener('click', () => {
            if (!gameRunning) {
                gameRunning = true;
            }
        });

        // 初始化并开始游戏循环
        init();
        gameLoop();
    </script>
</body>
</html>
