<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>打砖块游戏</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            font-family: 'Arial', sans-serif;
        }
        .game-container {
            text-align: center;
        }
        canvas {
            background: #0f0f23;
            border: 3px solid #4a9eff;
            border-radius: 10px;
            box-shadow: 0 0 30px rgba(74, 158, 255, 0.3);
        }
        .info {
            color: #fff;
            margin: 15px 0;
            font-size: 18px;
        }
        .info span {
            color: #4a9eff;
            font-weight: bold;
            margin: 0 15px;
        }
        .controls {
            color: #888;
            font-size: 14px;
            margin-top: 10px;
        }
        .btn {
            background: #4a9eff;
            color: #fff;
            border: none;
            padding: 12px 30px;
            font-size: 16px;
            border-radius: 25px;
            cursor: pointer;
            margin-top: 15px;
            transition: all 0.3s;
        }
        .btn:hover {
            background: #2d7dd2;
            transform: scale(1.05);
        }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="info">
            <span>分数: <span id="score">0</span></span>
            <span>生命: <span id="lives">3</span></span>
        </div>
        <canvas id="gameCanvas" width="480" height="400"></canvas>
        <button class="btn" id="startBtn">开始游戏</button>
        <div class="controls">使用 ← → 方向键 或 鼠标移动挡板</div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('score');
        const livesEl = document.getElementById('lives');
        const startBtn = document.getElementById('startBtn');

        // 游戏状态
        let score = 0;
        let lives = 3;
        let gameRunning = false;
        let animationId;

        // 挡板
        const paddle = {
            width: 80,
            height: 12,
            x: canvas.width / 2 - 40,
            y: canvas.height - 25,
            speed: 7,
            dx: 0
        };

        // 球
        const ball = {
            x: canvas.width / 2,
            y: canvas.height - 40,
            radius: 8,
            speed: 4,
            dx: 4,
            dy: -4
        };

        // 砖块
        const brickConfig = {
            rows: 4,
            cols: 8,
            width: 52,
            height: 18,
            padding: 6,
            offsetTop: 40,
            offsetLeft: 12
        };

        const bricks = [];
        const colors = ['#ff6b6b', '#feca57', '#48dbfb', '#1dd1a1'];

        // 初始化砖块
        function initBricks() {
            bricks.length = 0;
            for (let r = 0; r < brickConfig.rows; r++) {
                bricks[r] = [];
                for (let c = 0; c < brickConfig.cols; c++) {
                    bricks[r][c] = {
                        x: c * (brickConfig.width + brickConfig.padding) + brickConfig.offsetLeft,
                        y: r * (brickConfig.height + brickConfig.padding) + brickConfig.offsetTop,
                        visible: true,
                        color: colors[r]
                    };
                }
            }
        }

        // 绘制挡板
        function drawPaddle() {
            ctx.beginPath();
            ctx.roundRect(paddle.x, paddle.y, paddle.width, paddle.height, 6);
            ctx.fillStyle = '#4a9eff';
            ctx.fill();
            ctx.closePath();
        }

        // 绘制球
        function drawBall() {
            ctx.beginPath();
            ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
            const gradient = ctx.createRadialGradient(ball.x, ball.y, 0, ball.x, ball.y, ball.radius);
            gradient.addColorStop(0, '#fff');
            gradient.addColorStop(1, '#4a9eff');
            ctx.fillStyle = gradient;
            ctx.fill();
            ctx.closePath();
        }

        // 绘制砖块
        function drawBricks() {
            for (let r = 0; r < brickConfig.rows; r++) {
                for (let c = 0; c < brickConfig.cols; c++) {
                    const brick = bricks[r][c];
                    if (brick.visible) {
                        ctx.beginPath();
                        ctx.roundRect(brick.x, brick.y, brickConfig.width, brickConfig.height, 4);
                        ctx.fillStyle = brick.color;
                        ctx.fill();
                        ctx.closePath();
                    }
                }
            }
        }

        // 碰撞检测
        function collisionDetection() {
            for (let r = 0; r < brickConfig.rows; r++) {
                for (let c = 0; c < brickConfig.cols; c++) {
                    const brick = bricks[r][c];
                    if (brick.visible) {
                        if (ball.x > brick.x && ball.x < brick.x + brickConfig.width &&
                            ball.y > brick.y && ball.y < brick.y + brickConfig.height) {
                            ball.dy = -ball.dy;
                            brick.visible = false;
                            score += 10;
                            scoreEl.textContent = score;
                            
                            if (score === brickConfig.rows * brickConfig.cols * 10) {
                                gameOver(true);
                            }
                        }
                    }
                }
            }
        }

        // 移动挡板
        function movePaddle() {
            paddle.x += paddle.dx;
            if (paddle.x < 0) paddle.x = 0;
            if (paddle.x + paddle.width > canvas.width) paddle.x = canvas.width - paddle.width;
        }

        // 移动球
        function moveBall() {
            ball.x += ball.dx;
            ball.y += ball.dy;

            // 左右墙壁碰撞
            if (ball.x + ball.radius > canvas.width || ball.x - ball.radius < 0) {
                ball.dx = -ball.dx;
            }

            // 顶部碰撞
            if (ball.y - ball.radius < 0) {
                ball.dy = -ball.dy;
            }

            // 挡板碰撞
            if (ball.y + ball.radius > paddle.y &&
                ball.x > paddle.x && ball.x < paddle.x + paddle.width) {
                ball.dy = -ball.dy;
                // 根据击中位置改变角度
                const hitPos = (ball.x - paddle.x) / paddle.width;
                ball.dx = 8 * (hitPos - 0.5);
            }

            // 底部碰撞
            if (ball.y + ball.radius > canvas.height) {
                lives--;
                livesEl.textContent = lives;
                if (lives === 0) {
                    gameOver(false);
                } else {
                    resetBall();
                }
            }
        }

        // 重置球的位置
        function resetBall() {
            ball.x = canvas.width / 2;
            ball.y = canvas.height - 40;
            ball.dx = 4 * (Math.random() > 0.5 ? 1 : -1);
            ball.dy = -4;
            paddle.x = canvas.width / 2 - paddle.width / 2;
        }

        // 游戏结束
        function gameOver(win) {
            gameRunning = false;
            cancelAnimationFrame(animationId);
            
            ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            ctx.fillStyle = win ? '#1dd1a1' : '#ff6b6b';
            ctx.font = 'bold 36px Arial';
            ctx.textAlign = 'center';
            ctx.fillText(win ? '恭喜通关!' : '游戏结束', canvas.width / 2, canvas.height / 2);
            
            ctx.fillStyle = '#fff';
            ctx.font = '20px Arial';
            ctx.fillText(`最终得分: ${score}`, canvas.width / 2, canvas.height / 2 + 40);
            
            startBtn.textContent = '重新开始';
        }

        // 清空画布
        function clearCanvas() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
        }

        // 游戏循环
        function gameLoop() {
            if (!gameRunning) return;
            
            clearCanvas();
            drawBricks();
            drawPaddle();
            drawBall();
            collisionDetection();
            movePaddle();
            moveBall();
            
            animationId = requestAnimationFrame(gameLoop);
        }

        // 开始游戏
        function startGame() {
            score = 0;
            lives = 3;
            scoreEl.textContent = score;
            livesEl.textContent = lives;
            gameRunning = true;
            startBtn.textContent = '游戏进行中...';
            startBtn.disabled = true;
            
            initBricks();
            resetBall();
            gameLoop();
        }

        // 键盘事件
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft' || e.key === 'Left') {
                paddle.dx = -paddle.speed;
            } else if (e.key === 'ArrowRight' || e.key === 'Right') {
                paddle.dx = paddle.speed;
            }
        });

        document.addEventListener('keyup', (e) => {
            if (e.key === 'ArrowLeft' || e.key === 'ArrowRight' ||
                e.key === 'Left' || e.key === 'Right') {
                paddle.dx = 0;
            }
        });

        // 鼠标控制
        canvas.addEventListener('mousemove', (e) => {
            const rect = canvas.getBoundingClientRect();
            const mouseX = e.clientX - rect.left;
            paddle.x = mouseX - paddle.width / 2;
            if (paddle.x < 0) paddle.x = 0;
            if (paddle.x + paddle.width > canvas.width) paddle.x = canvas.width - paddle.width;
        });

        // 按钮点击
        startBtn.addEventListener('click', startGame);

        // 初始画面
        initBricks();
        drawBricks();
        drawPaddle();
        ctx.fillStyle = '#fff';
        ctx.font = '24px Arial';
        ctx.textAlign = 'center';
        ctx.fillText('点击"开始游戏"', canvas.width / 2, canvas.height / 2);
    </script>
</body>
</html>
