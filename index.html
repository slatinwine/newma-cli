<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文件上传与下载演示</title>
    <style>
        body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; background-color: #f4f4f4; }
        .container { background: white; padding: 2rem; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); text-align: center; width: 300px; }
        input[type="file"] { margin: 20px 0; }
        button { padding: 10px 20px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:disabled { background: #ccc; cursor: not-allowed; }
        .info { margin-top: 15px; font-size: 14px; color: #555; }
        .download-link { display: none; margin-top: 15px; color: #007bff; text-decoration: underline; cursor: pointer; }
    </style>
</head>
<body>
    <div class="container">
        <h2>文件上传演示</h2>
        <input type="file" id="fileInput">
        <button id="downloadBtn" disabled>下载文件</button>
        <div class="info" id="fileInfo"></div>
        <a id="downloadLink" class="download-link">点击下载</a>
    </div>

    <script>
        const fileInput = document.getElementById('fileInput');
        const downloadBtn = document.getElementById('downloadBtn');
        const fileInfo = document.getElementById('fileInfo');
        const downloadLink = document.getElementById('downloadLink');

        fileInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                fileInfo.textContent = `已选择: ${file.name} (${(file.size / 1024).toFixed(2)} KB)`;
                downloadLink.style.display = 'inline-block';
                downloadLink.textContent = `下载 ${file.name}`;
                // Generate object URL for download
                downloadLink.href = URL.createObjectURL(file);
                downloadBtn.disabled = true; // Hide button in favor of link, or keep both
            } else {
                fileInfo.textContent = '';
                downloadLink.style.display = 'none';
            }
        });
    </script>
</body>
</html>
