<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>雷电战机</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Arial', sans-serif;
            overflow: hidden;
        }
        .game-container {
            position: relative;
            border: 3px solid #00ffff;
            box-shadow: 0 0 30px rgba(0, 255, 255, 0.5);
            border-radius: 10px;
            overflow: hidden;
        }
        canvas {
            display: block;
            background: #000;
        }
        .ui {
            position: absolute;
            top: 10px;
            left: 10px;
            color: #fff;
            font-size: 16px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            z-index: 10;
        }
        .health-bar {
            position: absolute;
            top: 10px;
            right: 10px;
            width: 200px;
            height: 20px;
            background: #333;
            border: 2px solid #fff;
            border-radius: 10px;
            overflow: hidden;
            z-index: 10;
        }
        .health-fill {
            height: 100%;
            background: linear-gradient(90deg, #ff0000, #00ff00);
            transition: width 0.3s;
        }
        .game-over {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.9);
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            color: #fff;
            display: none;
            z-index: 20;
            border: 3px solid #ff0000;
        }
        .game-over h2 {
            font-size: 48px;
            margin-bottom: 20px;
            color: #ff0000;
            text-shadow: 0 0 20px #ff0000;
        }
        .game-over p {
            font-size: 24px;
            margin: 10px 0;
        }
        .restart-btn {
            margin-top: 20px;
            padding: 15px 40px;
            font-size: 20px;
            background: linear-gradient(45deg, #00ffff, #0080ff);
            border: none;
            border-radius: 30px;
            color: #000;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: bold;
        }
        .restart-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 0 30px rgba(0, 255, 255, 0.8);
        }
        .start-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.95);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #fff;
            z-index: 30;
        }
        .start-screen h1 {
            font-size: 72px;
            background: linear-gradient(45deg, #00ffff, #ff00ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 50px rgba(0, 255, 255, 0.5);
            margin-bottom: 30px;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        .controls {
            font-size: 18px;
            margin: 20px 0;
            line-height: 2;
        }
        .start-btn {
            margin-top: 30px;
            padding: 20px 60px;
            font-size: 24px;
            background: linear-gradient(45deg, #ff0000, #ff8800);
            border: none;
            border-radius: 30px;
            color: #fff;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: bold;
        }
        .start-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 0 40px rgba(255, 0, 0, 0.8);
        }
    </style>
</head>
<body>
    <div class="game-container">
        <canvas id="gameCanvas" width="600" height="800"></canvas>
        <div class="ui">
            <div>分数: <span id="score">0</span></div>
            <div>等级: <span id="level">1</span></div>
        </div>
        <div class="health-bar">
            <div class="health-fill" id="healthFill"></div>
        </div>
        <div class="game-over" id="gameOver">
            <h2>游戏结束</h2>
            <p>最终分数: <span id="finalScore">0</span></p>
            <p>最高等级: <span id="finalLevel">1</span></p>
            <button class="restart-btn" onclick="restartGame()">重新开始</button>
        </div>
        <div class="start-screen" id="startScreen">
            <h1>⚡ 雷电战机 ⚡</h1>
            <div class="controls">
                <p>🎮 控制方式:</p>
                <p>↑ ↓ ← → 或 WASD: 移动</p>
                <p>空格键: 发射子弹</p>
                <p>躲避敌机子弹，消灭敌机得分！</p>
            </div>
            <button class="start-btn" onclick="startGame()">开始游戏</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        // 游戏状态
        let gameRunning = false;
        let score = 0;
        let level = 1;
        let enemySpawnRate = 60;
        let frameCount = 0;
        
        // 玩家
        const player = {
            x: canvas.width / 2,
            y: canvas.height - 100,
            width: 50,
            height: 60,
            speed: 8,
            health: 100,
            maxHealth: 100,
            bullets: [],
            bulletSpeed: 12,
            shootCooldown: 0,
            shootDelay: 8
        };
        
        // 敌人数组
        let enemies = [];
        let enemyBullets = [];
        let particles = [];
        let powerUps = [];
        
        // 星星背景
        let stars = [];
        for (let i = 0; i < 100; i++) {
            stars.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                size: Math.random() * 3 + 1,
                speed: Math.random() * 3 + 1
            });
        }
        
        // 按键状态
        const keys = {};
        
        document.addEventListener('keydown', (e) => {
            keys[e.key] = true;
            if (e.key === ' ') e.preventDefault();
        });
        
        document.addEventListener('keyup', (e) => {
            keys[e.key] = false;
        });
        
        // 绘制玩家飞机
        function drawPlayer() {
            ctx.save();
            ctx.translate(player.x, player.y);
            
            // 机身
            ctx.fillStyle = '#00ffff';
            ctx.beginPath();
            ctx.moveTo(0, -player.height/2);
            ctx.lineTo(-player.width/2, player.height/2);
            ctx.lineTo(0, player.height/3);
            ctx.lineTo(player.width/2, player.height/2);
            ctx.closePath();
            ctx.fill();
            
            // 驾驶舱
            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.ellipse(0, -5, 8, 15, 0, 0, Math.PI * 2);
            ctx.fill();
            
            // 引擎火焰
            ctx.fillStyle = '#ff6600';
            ctx.beginPath();
            ctx.moveTo(-8, player.height/3);
            ctx.lineTo(0, player.height/2 + Math.random() * 20);
            ctx.lineTo(8, player.height/3);
            ctx.closePath();
            ctx.fill();
            
            // 机翼装饰
            ctx.strokeStyle = '#0080ff';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(0, -20);
            ctx.lineTo(0, 20);
            ctx.stroke();
            
            ctx.restore();
        }
        
        // 绘制敌机
        function drawEnemy(enemy) {
            ctx.save();
            ctx.translate(enemy.x, enemy.y);
            
            if (enemy.type === 'normal') {
                // 普通敌机
                ctx.fillStyle = '#ff4444';
                ctx.beginPath();
                ctx.moveTo(0, enemy.height/2);
                ctx.lineTo(-enemy.width/2, -enemy.height/2);
                ctx.lineTo(enemy.width/2, -enemy.height/2);
                ctx.closePath();
                ctx.fill();
                
                // 机翼
                ctx.fillStyle = '#cc0000';
                ctx.fillRect(-enemy.width, -5, enemy.width/3, 20);
                ctx.fillRect(enemy.width/2*3, -5, enemy.width/3, 20);
            } else if (enemy.type === 'fast') {
                // 快速敌机
                ctx.fillStyle = '#ff00ff';
                ctx.beginPath();
                ctx.moveTo(0, enemy.height/2);
                ctx.lineTo(-enemy.width/3, -enemy.height/2);
                ctx.lineTo(enemy.width/3, -enemy.height/2);
                ctx.closePath();
                ctx.fill();
            } else if (enemy.type === 'boss') {
                // Boss
                ctx.fillStyle = '#ffff00';
                ctx.fillRect(-enemy.width/2, -enemy.height/2, enemy.width, enemy.height);
                
                // Boss血条
                ctx.fillStyle = '#333';
                ctx.fillRect(-enemy.width/2, -enemy.height/2 - 20, enemy.width, 10);
                ctx.fillStyle = '#ff0000';
                ctx.fillRect(-enemy.width/2, -enemy.height/2 - 20, enemy.width * (enemy.health / enemy.maxHealth), 10);
            }
            
            ctx.restore();
        }
        
        // 绘制子弹
        function drawBullet(bullet, isEnemy = false) {
            ctx.fillStyle = isEnemy ? '#ff0000' : '#00ffff';
            ctx.shadowBlur = 10;
            ctx.shadowColor = isEnemy ? '#ff0000' : '#00ffff';
            
            ctx.beginPath();
            ctx.arc(bullet.x, bullet.y, isEnemy ? 6 : 4, 0, Math.PI * 2);
            ctx.fill();
            
            ctx.shadowBlur = 0;
        }
        
        // 绘制粒子效果
        function drawParticles() {
            particles.forEach((particle, index) => {
                particle.x += particle.vx;
                particle.y += particle.vy;
                particle.life--;
                
                if (particle.life <= 0) {
                    particles.splice(index, 1);
                    return;
                }
                
                ctx.fillStyle = `rgba(${particle.color}, ${particle.life / particle.maxLife})`;
                ctx.beginPath();
                ctx.arc(particle.x, particle.y, particle.size * (particle.life / particle.maxLife), 0, Math.PI * 2);
                ctx.fill();
            });
        }
        
        // 创建爆炸效果
        function createExplosion(x, y, color = '255, 100, 0') {
            for (let i = 0; i < 30; i++) {
                particles.push({
                    x: x,
                    y: y,
                    vx: (Math.random() - 0.5) * 8,
                    vy: (Math.random() - 0.5) * 8,
                    size: Math.random() * 8 + 2,
                    life: 30 + Math.random() * 20,
                    maxLife: 50,
                    color: color
                });
            }
        }
        
        // 绘制道具
        function drawPowerUp(powerUp) {
            ctx.save();
            ctx.translate(powerUp.x, powerUp.y);
            ctx.rotate(frameCount * 0.05);
            
            if (powerUp.type === 'health') {
                ctx.fillStyle = '#00ff00';
                ctx.fillRect(-15, -15, 30, 30);
                ctx.fillStyle = '#fff';
                ctx.font = 'bold 20px Arial';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('+', 0, 0);
            } else if (powerUp.type === 'power') {
                ctx.fillStyle = '#ffff00';
                ctx.fillRect(-15, -15, 30, 30);
                ctx.fillStyle = '#ff0000';
                ctx.font = 'bold 14px Arial';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('P', 0, 0);
            }
            
            ctx.restore();
        }
        
        // 绘制星星背景
        function drawStars() {
            ctx.fillStyle = '#ffffff';
            stars.forEach(star => {
                star.y += star.speed;
                if (star.y > canvas.height) {
                    star.y = 0;
                    star.x = Math.random() * canvas.width;
                }
                
                ctx.beginPath();
                ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
                ctx.fill();
            });
        }
        
        // 更新玩家
        function updatePlayer() {
            if (keys['ArrowLeft'] || keys['a'] || keys['A']) {
                player.x -= player.speed;
            }
            if (keys['ArrowRight'] || keys['d'] || keys['D']) {
                player.x += player.speed;
            }
            if (keys['ArrowUp'] || keys['w'] || keys['W']) {
                player.y -= player.speed;
            }
            if (keys['ArrowDown'] || keys['s'] || keys['S']) {
                player.y += player.speed;
            }
            
            // 边界检测
            player.x = Math.max(player.width/2, Math.min(canvas.width - player.width/2, player.x));
            player.y = Math.max(player.height/2, Math.min(canvas.height - player.height/2, player.y));
            
            // 射击
            if (keys[' '] && player.shootCooldown <= 0) {
                player.bullets.push({
                    x: player.x - 15,
                    y: player.y - player.height/2,
                    speed: player.bulletSpeed
                });
                player.bullets.push({
                    x: player.x + 15,
                    y: player.y - player.height/2,
                    speed: player.bulletSpeed
                });
                player.shootCooldown = player.shootDelay;
            }
            
            if (player.shootCooldown > 0) {
                player.shootCooldown--;
            }
            
            // 更新子弹
            player.bullets.forEach((bullet, index) => {
                bullet.y -= bullet.speed;
                if (bullet.y < 0) {
                    player.bullets.splice(index, 1);
                }
            });
        }
        
        // 生成敌机
        function spawnEnemy() {
            if (frameCount % enemySpawnRate === 0) {
                const type = Math.random();
                let enemy;
                
                if (type < 0.6) {
                    enemy = {
                        x: Math.random() * (canvas.width - 60) + 30,
                        y: -50,
                        width: 40,
                        height: 40,
                        speed: 3 + level * 0.5,
                        health: 1,
                        maxHealth: 1,
                        type: 'normal',
                        shootRate: 120,
                        shootCooldown: 0
                    };
                } else if (type < 0.9) {
                    enemy = {
                        x: Math.random() * (canvas.width - 30) + 15,
                        y: -50,
                        width: 30,
                        height: 30,
                        speed: 6 + level * 0.3,
                        health: 1,
                        maxHealth: 1,
                        type: 'fast',
                        shootRate: 80,
                        shootCooldown: 0
                    };
                } else {
                    // Boss
                    enemy = {
                        x: canvas.width / 2,
                        y: -100,
                        width: 100,
                        height: 80,
                        speed: 2,
                        health: 10 + level * 2,
                        maxHealth: 10 + level * 2,
                        type: 'boss',
                        shootRate: 40,
                        shootCooldown: 0
                    };
                }
                
                enemies.push(enemy);
            }
        }
        
        // 更新敌机
        function updateEnemies() {
            enemies.forEach((enemy, enemyIndex) => {
                enemy.y += enemy.speed;
                
                // 敌机射击
                if (enemy.shootCooldown > 0) {
                    enemy.shootCooldown--;
                } else {
                    if (enemy.type === 'boss') {
                        // Boss 发射多发子弹
                        for (let i = -2; i <= 2; i++) {
                            enemyBullets.push({
                                x: enemy.x + i * 20,
                                y: enemy.y + enemy.height/2,
                                vx: i * 0.5,
                                vy: 5,
                                size: 8
                            });
                        }
                        enemy.shootCooldown = enemy.shootRate;
                    } else if (Math.random() < 0.3) {
                        enemyBullets.push({
                            x: enemy.x,
                            y: enemy.y + enemy.height/2,
                            vx: (player.x - enemy.x) * 0.02,
                            vy: 4,
                            size: 6
                        });
                        enemy.shootCooldown = enemy.shootRate;
                    }
                }
                
                // 移除超出屏幕的敌机
                if (enemy.y > canvas.height + 50) {
                    enemies.splice(enemyIndex, 1);
                }
            });
            
            // 更新敌机子弹
            enemyBullets.forEach((bullet, index) => {
                bullet.x += bullet.vx;
                bullet.y += bullet.vy;
                
                if (bullet.y > canvas.height || bullet.y < 0 || 
                    bullet.x < 0 || bullet.x > canvas.width) {
                    enemyBullets.splice(index, 1);
                }
            });
        }
        
        // 碰撞检测
        function checkCollisions() {
            // 玩家子弹击中敌机
            player.bullets.forEach((bullet, bulletIndex) => {
                enemies.forEach((enemy, enemyIndex) => {
                    if (bullet.x > enemy.x - enemy.width/2 && 
                        bullet.x < enemy.x + enemy.width/2 &&
                        bullet.y > enemy.y - enemy.height/2 && 
                        bullet.y < enemy.y + enemy.height/2) {
                        
                        enemy.health--;
                        player.bullets.splice(bulletIndex, 1);
                        
                        if (enemy.health <= 0) {
                            createExplosion(enemy.x, enemy.y, 
                                enemy.type === 'boss' ? '255, 255, 0' : '255, 100, 0');
                            
                            // 加分
                            const points = enemy.type === 'boss' ? 500 : 
                                         enemy.type === 'fast' ? 20 : 10;
                            score += points * level;
                            
                            // 可能掉落道具
                            if (Math.random() < 0.1) {
                                powerUps.push({
                                    x: enemy.x,
                                    y: enemy.y,
                                    type: Math.random() < 0.5 ? 'health' : 'power',
                                    vy: 2
                                });
                            }
                            
                            enemies.splice(enemyIndex, 1);
                            
                            // 升级
                            if (score >= level * 500) {
                                level++;
                                enemySpawnRate = Math.max(20, 60 - level * 5);
                            }
                        }
                    }
                });
            });
            
            // 敌机子弹击中玩家
            enemyBullets.forEach((bullet, index) => {
                if (bullet.x > player.x - player.width/2 && 
                    bullet.x < player.x + player.width/2 &&
                    bullet.y > player.y - player.height/2 && 
                    bullet.y < player.y + player.height/2) {
                    
                    player.health -= 10;
                    createExplosion(bullet.x, bullet.y, '255, 50, 50');
                    enemyBullets.splice(index, 1);
                    
                    if (player.health <= 0) {
                        gameOver();
                    }
                }
            });
            
            // 敌机撞玩家
            enemies.forEach((enemy, index) => {
                if (enemy.x > player.x - player.width/2 - enemy.width/2 && 
                    enemy.x < player.x + player.width/2 + enemy.width/2 &&
                    enemy.y > player.y - player.height/2 - enemy.height/2 && 
                    enemy.y < player.y + player.height/2 + enemy.height/2) {
                    
                    player.health -= 20;
                    createExplosion(enemy.x, enemy.y, '255, 100, 0');
                    enemies.splice(index, 1);
                    
                    if (player.health <= 0) {
                        gameOver();
                    }
                }
            });
            
            // 玩家拾取道具
            powerUps.forEach((powerUp, index) => {
                powerUp.y += powerUp.vy;
                
                if (powerUp.x > player.x - player.width/2 - 20 && 
                    powerUp.x < player.x + player.width/2 + 20 &&
                    powerUp.y > player.y - player.height/2 - 20 && 
                    powerUp.y < player.y + player.height/2 + 20) {
                    
                    if (powerUp.type === 'health') {
                        player.health = Math.min(player.maxHealth, player.health + 30);
                    } else if (powerUp.type === 'power') {
                        score += 100;
                    }
                    
                    powerUps.splice(index, 1);
                }
                
                if (powerUp.y > canvas.height) {
                    powerUps.splice(index, 1);
                }
            });
        }
        
        // 更新UI
        function updateUI() {
            document.getElementById('score').textContent = score;
            document.getElementById('level').textContent = level;
            document.getElementById('healthFill').style.width = 
                (player.health / player.maxHealth * 100) + '%';
        }
        
        // 游戏主循环
        function gameLoop() {
            if (!gameRunning) return;
            
            // 清空画布
            ctx.fillStyle = '#000011';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // 绘制背景
            drawStars();
            
            // 更新游戏状态
            frameCount++;
            updatePlayer();
            spawnEnemy();
            updateEnemies();
            checkCollisions();
            
            // 绘制所有元素
            player.bullets.forEach(bullet => drawBullet(bullet));
            enemies.forEach(enemy => drawEnemy(enemy));
            enemyBullets.forEach(bullet => drawBullet(bullet, true));
            drawPlayer();
            drawParticles();
            powerUps.forEach(powerUp => drawPowerUp(powerUp));
            
            // 更新UI
            updateUI();
            
            requestAnimationFrame(gameLoop);
        }
        
        // 游戏结束
        function gameOver() {
            gameRunning = false;
            document.getElementById('finalScore').textContent = score;
            document.getElementById('finalLevel').textContent = level;
            document.getElementById('gameOver').style.display = 'block';
            createExplosion(player.x, player.y, '0, 255, 255');
        }
        
        // 开始游戏
        function startGame() {
            document.getElementById('startScreen').style.display = 'none';
            resetGame();
            gameRunning = true;
            gameLoop();
        }
        
        // 重新开始
        function restartGame() {
            document.getElementById('gameOver').style.display = 'none';
            resetGame();
            gameRunning = true;
            gameLoop();
        }
        
        // 重置游戏
        function resetGame() {
            player.x = canvas.width / 2;
            player.y = canvas.height - 100;
            player.health = player.maxHealth;
            player.bullets = [];
            enemies = [];
            enemyBullets = [];
            particles = [];
            powerUps = [];
            score = 0;
            level = 1;
            enemySpawnRate = 60;
            frameCount = 0;
            updateUI();
        }
    </script>
</body>
</html>
