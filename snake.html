<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>贪吃蛇游戏</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            font-family: 'Arial', sans-serif;
            color: #fff;
        }

        h1 {
            margin-bottom: 20px;
            color: #4ecdc4;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }

        .game-container {
            display: flex;
            gap: 30px;
            align-items: flex-start;
        }

        .canvas-container {
            position: relative;
        }

        canvas {
            border: 3px solid #4ecdc4;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(78, 205, 196, 0.3);
        }

        .info-panel {
            background: rgba(255, 255, 255, 0.1);
            padding: 20px;
            border-radius: 10px;
            min-width: 200px;
        }

        .score-display {
            font-size: 24px;
            margin-bottom: 10px;
            color: #ffd93d;
        }

        .high-score {
            font-size: 18px;
            margin-bottom: 20px;
            color: #ff6b6b;
        }

        .controls {
            margin-bottom: 20px;
        }

        .controls h3 {
            margin-bottom: 10px;
            color: #4ecdc4;
        }

        .controls p {
            font-size: 14px;
            margin: 5px 0;
            color: #ccc;
        }

        .btn {
            display: block;
            width: 100%;
            padding: 12px;
            margin-bottom: 10px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-start {
            background: #4ecdc4;
            color: #1a1a2e;
        }

        .btn-start:hover {
            background: #3dbdb5;
            transform: scale(1.05);
        }

        .btn-pause {
            background: #ffd93d;
            color: #1a1a2e;
        }

        .btn-pause:hover {
            background: #e6c93d;
            transform: scale(1.05);
        }

        .btn-restart {
            background: #ff6b6b;
            color: #fff;
        }

        .btn-restart:hover {
            background: #e65a5a;
            transform: scale(1.05);
        }

        .game-over {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.9);
            padding: 30px;
            border-radius: 10px;
            text-align: center;
            display: none;
        }

        .game-over h2 {
            color: #ff6b6b;
            margin-bottom: 10px;
        }

        .game-over p {
            margin: 10px 0;
            font-size: 18px;
        }

        .speed-selector {
            margin-bottom: 20px;
        }

        .speed-selector select {
            width: 100%;
            padding: 8px;
            font-size: 14px;
            border-radius: 5px;
            border: none;
            background: #4ecdc4;
            color: #1a1a2e;
            cursor: pointer;
        }

        .paused {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 48px;
            color: #4ecdc4;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
            display: none;
        }
    </style>
</head>
<body>
    <h1>🐍 贪吃蛇游戏</h1>
    
    <div class="game-container">
        <div class="canvas-container">
            <canvas id="gameCanvas" width="400" height="400"></canvas>
            <div class="game-over" id="gameOver">
                <h2>游戏结束!</h2>
                <p>最终得分: <span id="finalScore">0</span></p>
                <p>蛇的长度: <span id="finalLength">0</span></p>
            </div>
            <div class="paused" id="paused">已暂停</div>
        </div>
        
        <div class="info-panel">
            <div class="score-display">
                得分: <span id="score">0</span>
            </div>
            <div class="high-score">
                最高分: <span id="highScore">0</span>
            </div>
            
            <div class="speed-selector">
                <label for="speed">游戏速度:</label>
                <select id="speed">
                    <option value="150">慢速</option>
                    <option value="100" selected>中速</option>
                    <option value="70">快速</option>
                    <option value="40">极速</option>
                </select>
            </div>
            
            <button class="btn btn-start" id="startBtn">开始游戏</button>
            <button class="btn btn-pause" id="pauseBtn">暂停</button>
            <button class="btn btn-restart" id="restartBtn">重新开始</button>
            
            <div class="controls">
                <h3>操作说明</h3>
                <p>⬆️ 上箭头: 向上移动</p>
                <p>⬇️ 下箭头: 向下移动</p>
                <p>⬅️ 左箭头: 向左移动</p>
                <p>➡️ 右箭头: 向右移动</p>
                <p>空格键: 暂停/继续</p>
            </div>
        </div>
    </div>

    <script>
        // 获取DOM元素
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreDisplay = document.getElementById('score');
        const highScoreDisplay = document.getElementById('highScore');
        const finalScoreDisplay = document.getElementById('finalScore');
        const finalLengthDisplay = document.getElementById('finalLength');
        const gameOverDiv = document.getElementById('gameOver');
        const pausedDiv = document.getElementById('paused');
        const startBtn = document.getElementById('startBtn');
        const pauseBtn = document.getElementById('pauseBtn');
        const restartBtn = document.getElementById('restartBtn');
        const speedSelect = document.getElementById('speed');

        // 游戏配置
        const gridSize = 20;
        const tileCount = canvas.width / gridSize;

        // 游戏状态
        let snake = [];
        let food = {};
        let direction = { x: 0, y: 0 };
        let nextDirection = { x: 0, y: 0 };
        let score = 0;
        let highScore = localStorage.getItem('snakeHighScore') || 0;
        let gameLoop = null;
        let isGameRunning = false;
        let isPaused = false;
        let gameSpeed = 100;

        // 初始化显示
        highScoreDisplay.textContent = highScore;

        // 初始化游戏
        function initGame() {
            // 初始化蛇的位置（在中心）
            snake = [
                { x: Math.floor(tileCount / 2), y: Math.floor(tileCount / 2) }
            ];
            
            // 初始方向（向右）
            direction = { x: 1, y: 0 };
            nextDirection = { x: 1, y: 0 };
            
            // 重置分数
            score = 0;
            scoreDisplay.textContent = score;
            
            // 生成第一个食物
            generateFood();
            
            // 隐藏游戏结束界面
            gameOverDiv.style.display = 'none';
            pausedDiv.style.display = 'none';
            
            // 绘制初始状态
            draw();
        }

        // 生成食物
        function generateFood() {
            let newFood;
            do {
                newFood = {
                    x: Math.floor(Math.random() * tileCount),
                    y: Math.floor(Math.random() * tileCount)
                };
            } while (isSnakePosition(newFood.x, newFood.y));
            
            food = newFood;
        }

        // 检查是否是蛇的位置
        function isSnakePosition(x, y) {
            return snake.some(segment => segment.x === x && segment.y === y);
        }

        // 更新游戏状态
        function update() {
            // 更新方向
            direction = { ...nextDirection };
            
            // 计算新的头部位置
            const newHead = {
                x: snake[0].x + direction.x,
                y: snake[0].y + direction.y
            };
            
            // 检查碰撞检测
            if (checkCollision(newHead)) {
                endGame();
                return;
            }
            
            // 添加新头部
            snake.unshift(newHead);
            
            // 检查是否吃到食物
            if (newHead.x === food.x && newHead.y === food.y) {
                // 吃到食物，增加分数
                score += 10;
                scoreDisplay.textContent = score;
                
                // 更新最高分
                if (score > highScore) {
                    highScore = score;
                    highScoreDisplay.textContent = highScore;
                    localStorage.setItem('snakeHighScore', highScore);
                }
                
                // 生成新食物
                generateFood();
            } else {
                // 没吃到食物，移除尾部
                snake.pop();
            }
            
            // 绘制游戏
            draw();
        }

        // 碰撞检测
        function checkCollision(head) {
            // 检查是否撞墙
            if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount) {
                return true;
            }
            
            // 检查是否撞到自己（不包括尾巴，因为尾巴会移动）
            for (let i = 0; i < snake.length - 1; i++) {
                if (snake[i].x === head.x && snake[i].y === head.y) {
                    return true;
                }
            }
            
            return false;
        }

        // 绘制游戏
        function draw() {
            // 清空画布
            ctx.fillStyle = '#1a1a2e';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // 绘制网格（可选）
            ctx.strokeStyle = 'rgba(78, 205, 196, 0.1)';
            ctx.lineWidth = 1;
            for (let i = 0; i <= tileCount; i++) {
                ctx.beginPath();
                ctx.moveTo(i * gridSize, 0);
                ctx.lineTo(i * gridSize, canvas.height);
                ctx.stroke();
                
                ctx.beginPath();
                ctx.moveTo(0, i * gridSize);
                ctx.lineTo(canvas.width, i * gridSize);
                ctx.stroke();
            }
            
            // 绘制蛇
            snake.forEach((segment, index) => {
                const gradient = ctx.createRadialGradient(
                    segment.x * gridSize + gridSize / 2,
                    segment.y * gridSize + gridSize / 2,
                    0,
                    segment.x * gridSize + gridSize / 2,
                    segment.y * gridSize + gridSize / 2,
                    gridSize / 2
                );
                
                if (index === 0) {
                    // 蛇头
                    gradient.addColorStop(0, '#4ecdc4');
                    gradient.addColorStop(1, '#3dbdb5');
                } else {
                    // 蛇身
                    const alpha = 1 - (index / snake.length) * 0.5;
                    gradient.addColorStop(0, `rgba(78, 205, 196, ${alpha})`);
                    gradient.addColorStop(1, `rgba(61, 189, 181, ${alpha})`);
                }
                
                ctx.fillStyle = gradient;
                ctx.fillRect(
                    segment.x * gridSize + 1,
                    segment.y * gridSize + 1,
                    gridSize - 2,
                    gridSize - 2
                );
                
                // 为蛇头添加眼睛
                if (index === 0) {
                    ctx.fillStyle = '#1a1a2e';
                    const eyeSize = 3;
                    const eyeOffset = 5;
                    
                    // 根据方向调整眼睛位置
                    if (direction.x === 1) { // 向右
                        ctx.beginPath();
                        ctx.arc(segment.x * gridSize + gridSize - eyeOffset, segment.y * gridSize + eyeOffset, eyeSize, 0, Math.PI * 2);
                        ctx.arc(segment.x * gridSize + gridSize - eyeOffset, segment.y * gridSize + gridSize - eyeOffset, eyeSize, 0, Math.PI * 2);
                        ctx.fill();
                    } else if (direction.x === -1) { // 向左
                        ctx.beginPath();
                        ctx.arc(segment.x * gridSize + eyeOffset, segment.y * gridSize + eyeOffset, eyeSize, 0, Math.PI * 2);
                        ctx.arc(segment.x * gridSize + eyeOffset, segment.y * gridSize + gridSize - eyeOffset, eyeSize, 0, Math.PI * 2);
                        ctx.fill();
                    } else if (direction.y === -1) { // 向上
                        ctx.beginPath();
                        ctx.arc(segment.x * gridSize + eyeOffset, segment.y * gridSize + eyeOffset, eyeSize, 0, Math.PI * 2);
                        ctx.arc(segment.x * gridSize + gridSize - eyeOffset, segment.y * gridSize + eyeOffset, eyeSize, 0, Math.PI * 2);
                        ctx.fill();
                    } else { // 向下
                        ctx.beginPath();
                        ctx.arc(segment.x * gridSize + eyeOffset, segment.y * gridSize + gridSize - eyeOffset, eyeSize, 0, Math.PI * 2);
                        ctx.arc(segment.x * gridSize + gridSize - eyeOffset, segment.y * gridSize + gridSize - eyeOffset, eyeSize, 0, Math.PI * 2);
                        ctx.fill();
                    }
                }
            });
            
            // 绘制食物
            const foodGradient = ctx.createRadialGradient(
                food.x * gridSize + gridSize / 2,
                food.y * gridSize + gridSize / 2,
                0,
                food.x * gridSize + gridSize / 2,
                food.y * gridSize + gridSize / 2,
                gridSize / 2
            );
            foodGradient.addColorStop(0, '#ff6b6b');
            foodGradient.addColorStop(1, '#e65a5a');
            
            ctx.fillStyle = foodGradient;
            ctx.beginPath();
            ctx.arc(
                food.x * gridSize + gridSize / 2,
                food.y * gridSize + gridSize / 2,
                gridSize / 2 - 2,
                0,
                Math.PI * 2
            );
            ctx.fill();
            
            // 食物发光效果
            ctx.shadowColor = '#ff6b6b';
            ctx.shadowBlur = 10;
            ctx.fill();
            ctx.shadowBlur = 0;
        }

        // 开始游戏
        function startGame() {
            if (isGameRunning) return;
            
            initGame();
            isGameRunning = true;
            isPaused = false;
            gameSpeed = parseInt(speedSelect.value);
            gameLoop = setInterval(update, gameSpeed);
            startBtn.textContent = '游戏中...';
            startBtn.disabled = true;
        }

        // 暂停游戏
        function togglePause() {
            if (!isGameRunning) return;
            
            isPaused = !isPaused;
            
            if (isPaused) {
                clearInterval(gameLoop);
                pausedDiv.style.display = 'block';
                pauseBtn.textContent = '继续';
            } else {
                gameSpeed = parseInt(speedSelect.value);
                gameLoop = setInterval(update, gameSpeed);
                pausedDiv.style.display = 'none';
                pauseBtn.textContent = '暂停';
            }
        }

        // 结束游戏
        function endGame() {
            clearInterval(gameLoop);
            isGameRunning = false;
            isPaused = false;
            
            // 显示游戏结束信息
            finalScoreDisplay.textContent = score;
            finalLengthDisplay.textContent = snake.length;
            gameOverDiv.style.display = 'block';
            
            startBtn.textContent = '开始游戏';
            startBtn.disabled = false;
            pauseBtn.textContent = '暂停';
        }

        // 重新开始游戏
        function restartGame() {
            if (gameLoop) {
                clearInterval(gameLoop);
            }
            startGame();
        }

        // 键盘控制
        document.addEventListener('keydown', (e) => {
            // 防止页面滚动
            if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'].includes(e.code)) {
                e.preventDefault();
            }
            
            // 空格键暂停/继续
            if (e.code === 'Space') {
                if (isGameRunning) {
                    togglePause();
                } else {
                    startGame();
                }
                return;
            }
            
            // 方向控制
            if (isPaused) return;
            
            switch (e.code) {
                case 'ArrowUp':
                    if (direction.y !== 1) {
                        nextDirection = { x: 0, y: -1 };
                    }
                    break;
                case 'ArrowDown':
                    if (direction.y !== -1) {
                        nextDirection = { x: 0, y: 1 };
                    }
                    break;
                case 'ArrowLeft':
                    if (direction.x !== 1) {
                        nextDirection = { x: -1, y: 0 };
                    }
                    break;
                case 'ArrowRight':
                    if (direction.x !== -1) {
                        nextDirection = { x: 1, y: 0 };
                    }
                    break;
            }
        });

        // 按钮事件
        startBtn.addEventListener('click', startGame);
        pauseBtn.addEventListener('click', togglePause);
        restartBtn.addEventListener('click', restartGame);

        // 速度选择
        speedSelect.addEventListener('change', () => {
            if (isGameRunning && !isPaused) {
                clearInterval(gameLoop);
                gameSpeed = parseInt(speedSelect.value);
                gameLoop = setInterval(update, gameSpeed);
            }
        });

        // 初始化
        initGame();
    </script>
</body>
</html>
