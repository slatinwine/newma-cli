name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build（ui 先行解决 ink-repl 产物依赖，postbuild 补 ESM 后缀）
        run: npm run build

      - name: Smoke test — dist 必须无需 loader 直接运行
        run: |
          node dist/cli.js --version
          node dist/cli.js --help > /dev/null

      - name: Offline tests（tests/ 全套 + ultrathink 套件）
        run: npm test

      - name: Package smoke — 发布内容物检查
        run: npm pack --dry-run

      - name: Entry-point smoke — main/bin 入口与版本一致性
        run: node scripts/verify-smoke.mjs

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Type check（ui 先构建产物，消除对 dist/ui 的前向依赖）
        run: |
          npx tsc --project tsconfig.ui.json
          npx tsc --noEmit
